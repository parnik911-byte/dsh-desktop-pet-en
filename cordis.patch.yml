# dsh-desktop-pet bundle patch: mounts the desktop-pet Node half into the web
# profile. The Node half listens to agent/session events and pushes signals to
# the Electron pet window over local UDP; it also spawns the pet on boot.
# Install with `dsh plugin --profile web add @parnik911-byte/dsh-desktop-pet-en`.
# NOTE: `name` must be the FULL package name (@parnik911-byte/dsh-desktop-pet-en);
# the scoped package lives under node_modules/@parnik911-byte/, so an unscoped
# name would make the loader fail with ERR_MODULE_NOT_FOUND.
- insert:
    - id: dsh-desktop-pet
      name: '@parnik911-byte/dsh-desktop-pet-en'
